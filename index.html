<style>
:root{--rosa:#E5548C;--rosa-10:#FCEEF4;--tinta:#191919;--gris:#6e6e6e}
*{box-sizing:border-box;margin:0}

 radial-gradient(120% 60% at 100% 0%,var(--rosa-10),transparent 60%)}
.logo{width:190px;height:auto}
.sub{margin-top:6px;font-size:14px;color:var(--gris);text-align:center}
.lista{width:100%;margin-top:26px;display:flex;flex-direction:column;gap:12px}

.ic{flex:0 0 46px;height:46px;border-radius:13px;display:grid;place-items:center}
.ic svg{width:26px;height:26px;fill:#fff}
.t{display:flex;flex-direction:column;line-height:1.25}
.t b{font-weight:600;font-size:16px}
.t span{font-size:12.5px;color:var(--gris)}
.fl{margin-left:auto;color:var(--rosa);font-size:20px}
.wa{background:#25D366}.ig{background:linear-gradient(45deg,#f9a03f,#e1306c 55%,#833ab4)}.fb{background:#1877F2}.tk{background:#010101}.mp{background:var(--rosa)}.tel{background:#333}
footer{margin-top:30px;display:flex;flex-direction:column;align-items:center;gap:8px}
footer img{width:110px}
footer p{font-size:12px;color:var(--gris);text-align:center}
