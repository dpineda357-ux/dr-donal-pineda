<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
</head>
<body>
<title>Casos en clase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: una sola columna de proyección; barra de recorrido arriba (tronco + ramas), escena al centro, acciones del ponente abajo. */
:root{
  --bg:#f6f5f3; --surface:#ffffff; --ink:#1f1b1c; --muted:#5f5759; --line:#ddd7d6;
  --ues:#a6192e; --ues-soft:#f6e3e5;
  --ok:#1f7a4d; --ok-soft:#e1f2e8; --warn:#9a6200; --warn-soft:#fbf0d9; --bad:#b3261e; --bad-soft:#fbe4e2;
  --oA:#1f5fbf; --oB:#1f8a5b; --oC:#c98a00; --oD:#7b3fb0;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --s:clamp(15px,1.15vw + 6px,22px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161314; --surface:#211d1e; --ink:#f1ecec; --muted:#b6abad; --line:#3b3436;
  --ues:#e0596b; --ues-soft:#3a1d22;
  --ok:#5cc28f; --ok-soft:#173326; --warn:#e6b04a; --warn-soft:#352a12; --bad:#f07a70; --bad-soft:#3a1c1a;
  --oA:#6f9ef0; --oB:#4fc28d; --oC:#e6b33a; --oD:#b88ae6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161314; --surface:#211d1e; --ink:#f1ecec; --muted:#b6abad; --line:#3b3436;
  --ues:#e0596b; --ues-soft:#3a1d22;
  --ok:#5cc28f; --ok-soft:#173326; --warn:#e6b04a; --warn-soft:#352a12; --bad:#f07a70; --bad-soft:#3a1c1a;
  --oA:#6f9ef0; --oB:#4fc28d; --oC:#e6b33a; --oD:#b88ae6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--s);line-height:1.45}
.wrap{max-width:1280px;margin:0 auto;padding-inline:clamp(16px,3vw,48px);padding-block:18px 40px;display:flex;flex-direction:column;gap:22px}
header.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:3px solid var(--ues);padding-bottom:12px}
header.top img{width:44px;height:auto;border-radius:3px;background:#fff}
.inst{display:flex;flex-direction:column;line-height:1.15;min-width:0;flex:1}
.inst b{font-family:var(--f-display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.78em;color:var(--ues)}
.inst span{font-size:.72em;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;color:inherit}
.btn{font-family:var(--f-body);font-weight:600;font-size:.82em;padding:.55em 1em;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.btn:hover{border-color:var(--ues)}
.btn.primary{background:var(--ues);border-color:var(--ues);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn:focus-visible,.opt:focus-visible,.cnt button:focus-visible{outline:3px solid var(--oA);outline-offset:2px}
.btn[aria-pressed="true"]{background:var(--ues-soft);border-color:var(--ues)}

/* recorrido */
.track{display:flex;align-items:center;gap:0;overflow-x:auto;padding-bottom:4px}
.stop{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:84px;flex:1}
.clock{align-self:flex-end;font-family:var(--f-mono);font-size:.8em;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:-12px}
.clock.over{color:var(--bad);font-weight:500}
.dot{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);background:var(--bg)}
.stop.done .dot{background:var(--ues);border-color:var(--ues)}
.stop.now .dot{border-color:var(--ues);box-shadow:0 0 0 5px var(--ues-soft)}
.stop small{font-family:var(--f-mono);font-size:.62em;color:var(--muted);white-space:nowrap}
.stop.now small{color:var(--ues);font-weight:500}
.seg{height:3px;background:var(--line);flex:1;min-width:20px;margin-top:-18px}
.seg.done{background:var(--ues)}
.branches{display:flex;gap:3px;height:10px}
.br{width:9px;height:9px;border-radius:2px}

h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:2.6em;line-height:1.02;font-weight:700}
h2{font-size:1.75em;line-height:1.1;font-weight:700}
h3{font-size:1.05em;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
p{margin:0;max-width:68ch}
.eyebrow{font-family:var(--f-mono);font-size:.7em;letter-spacing:.12em;text-transform:uppercase;color:var(--ues)}
.stack{display:flex;flex-direction:column;gap:14px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:22px}
.cols>*{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px}

/* expediente */
.chart{font-family:var(--f-mono);font-size:.82em;width:100%;border-collapse:collapse}
.chart td{padding:.38em .5em;border-bottom:1px dashed var(--line);vertical-align:top}
.chart td:first-child{color:var(--muted);width:42%}
.chart .hi{color:var(--bad);font-weight:500}
.chart .new{background:var(--warn-soft)}
.tablewrap{overflow-x:auto}

/* opciones */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:12px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:14px 16px;font-size:.95em;min-width:0}
.opt .k{flex:none;width:2em;height:2em;border-radius:6px;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:700;font-size:1.1em}
.opt.pick{cursor:pointer}
.opt.pick:hover{border-color:var(--ues)}
.opt.seen{opacity:.72}
.k.A{background:var(--oA)} .k.B{background:var(--oB)} .k.C{background:var(--oC)} .k.D{background:var(--oD)}

/* conteo */
.tally{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tally th{font-family:var(--f-display);font-weight:600;font-size:.85em;color:var(--muted);text-align:center;padding:.3em}
.tally th:first-child{text-align:left}
.tally td{padding:.35em;border-top:1px solid var(--line);text-align:center}
.tally td:first-child{text-align:left}
.cnt{display:inline-flex;align-items:center;gap:6px}
.cnt button{width:1.8em;height:1.8em;border-radius:6px;border:1.5px solid var(--line);background:var(--bg);font-weight:700;line-height:1}
.cnt output{min-width:1.6em;font-family:var(--f-mono);font-weight:500;font-size:1.05em}
.timer{font-family:var(--f-mono);font-size:1.6em;font-variant-numeric:tabular-nums}
.timer.end{color:var(--bad)}

/* barras */
.bars{display:flex;flex-direction:column;gap:10px}
.barrow{display:grid;grid-template-columns:5.5em 1fr 3.5em;gap:10px;align-items:center}
.barrow b{font-family:var(--f-display);font-size:.95em}
.bar{display:flex;height:1.6em;border-radius:5px;overflow:hidden;background:var(--line)}
.bar span{display:grid;place-items:center;color:#fff;font-size:.7em;font-weight:600;font-family:var(--f-mono);transition:width .5s ease}
.bar .A{background:var(--oA)} .bar .B{background:var(--oB)} .bar .C{background:var(--oC)} .bar .D{background:var(--oD)}
.barrow small{font-family:var(--f-mono);color:var(--muted);font-size:.7em}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.75em;color:var(--muted)}
.legend i{display:inline-block;width:.9em;height:.9em;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* discusión */
.turns{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.turn{border-top:4px solid var(--ues);background:var(--surface);border-radius:0 0 8px 8px;padding:12px 14px;font-size:.88em;display:flex;flex-direction:column;gap:6px}
.turn b{font-family:var(--f-display);font-size:1.05em}

/* consecuencia */
.verdict{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:.8em;padding:.35em .8em;border-radius:6px}
.v-ok{background:var(--ok-soft);color:var(--ok)} .v-warn{background:var(--warn-soft);color:var(--warn)} .v-bad{background:var(--bad-soft);color:var(--bad)}
.story{font-size:1.05em;border-left:4px solid var(--line);padding-left:16px}
.lesson{background:var(--ues-soft);border-radius:10px;padding:14px 18px}
.lesson h3{color:var(--ues)}
ul.tight{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.k.mini{display:inline-grid;width:1.4em;height:1.4em;border-radius:4px;color:#fff;font-size:.8em;place-items:center;margin-right:8px;vertical-align:-2px;font-family:var(--f-display);font-weight:700}
ul.others{list-style:none;padding:0}
.fold{font-family:var(--f-mono);font-size:.78em;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:16px}
.actions .sp{flex:1}

/* notas */
.notes{border:2px dashed var(--warn);background:var(--warn-soft);border-radius:10px;padding:14px 18px;font-size:.85em}
.notes h3{color:var(--warn)}

/* portada */
.cover{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:820px){.cover{grid-template-columns:1fr}}
.rules{counter-reset:r;display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.rules li{counter-increment:r;display:grid;grid-template-columns:2em 1fr;gap:10px;font-size:.9em}
.rules li::before{content:counter(r);font-family:var(--f-display);font-weight:700;color:var(--ues);font-size:1.3em;line-height:1.1}
.cards{display:flex;gap:8px;flex-wrap:wrap}
.cards .k{width:2.4em;height:3.2em;border-radius:6px;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:700;font-size:1.2em}
.fig{margin:0 0 .8em;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#0b0b0d}
.fig svg,.fig img{display:block;width:100%;height:auto;max-height:210px;object-fit:contain}
.fig figcaption{font-size:.72em;color:#b9b9bf;padding:.35em .7em;background:#141417}
.integ td{vertical-align:top;text-align:left;font-size:.82em}
.integ td.lab{font-weight:600;white-space:nowrap}
.integ button.rev{font:inherit;width:100%;min-height:2.4em;text-align:left;background:var(--ues-soft);color:var(--muted);border:1.5px dashed var(--ues);border-radius:8px;cursor:pointer;padding:.3em .5em}
.integ .shown{display:block;padding:.3em .1em}
.sumtable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.85em}
.sumtable th,.sumtable td{padding:.45em .6em;border-bottom:1px solid var(--line);text-align:center}
.sumtable th:first-child,.sumtable td:first-child{text-align:left}
.sumtable th{font-family:var(--f-display);color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
@media (max-width:640px){.stop small{display:none}.stop.now small{display:block}.stop{min-width:28px}}
@media (prefers-reduced-motion: reduce){.bar span{transition:none}}
</style>

(function(){
  const scene = document.getElementById("scene");
  const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function open(pass){
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:u8(SEALED.s), iterations:200000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:u8(SEALED.i)}, key, u8(SEALED.c));
    const s = document.createElement("script"); s.textContent = new TextDecoder().decode(pt); document.body.appendChild(s);
  }
  async function tryPass(pass, quiet){
    try { await open(pass); try{ sessionStorage.setItem("casos-clave-"+location.pathname, pass); }catch(e){} return true; }
    catch(e){ if(!quiet){ const m = document.getElementById("lkErr"); if(m) m.textContent = "Clave incorrecta."; } return false; }
  }
  scene.innerHTML = `<section class="panel stack" style="max-width:420px">
    <h3>Clave del ponente</h3>
    <p class="muted" style="font-size:.85em">Los casos y sus respuestas están protegidos. Escriba la clave que le dio el docente.</p>
    <form id="lk" class="stack"><input id="lkPass" type="password" autocomplete="current-password" aria-label="Clave" style="font:inherit;padding:.6em .8em;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)">
    <div><button class="btn primary" type="submit">Abrir casos</button></div><p id="lkErr" role="alert" style="color:var(--ues);font-weight:600;margin:0"></p></form></section>`;
  document.getElementById("lk").addEventListener("submit", e => { e.preventDefault(); tryPass(document.getElementById("lkPass").value, false); });
  let saved = null; try{ saved = sessionStorage.getItem("casos-clave-"+location.pathname); }catch(e){}
  if (saved) tryPass(saved, true);
})();
</script>
